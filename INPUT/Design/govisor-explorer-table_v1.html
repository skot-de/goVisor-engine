<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goVisor — Explorer (Tabelle)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F6;--surface:#FFFFFF;--surface-2:#FAFBFA;--surface-3:#F1F3F2;
  --line:#E3E7E5;--line-strong:#CFD6D3;
  --ink-900:#12211D;--ink-700:#33453F;--ink-500:#64766F;--ink-400:#8C9B95;--ink-300:#B7C2BC;
  --signal:#10B981;--signal-deep:#067A55;--unread-wash:#EFF8F3;--signal-wash:#E7F7F1;
  --flag:#B45309;--flag-wash:#FBF2E6;--risk:#B3261E;--risk-wash:#FBECEB;
  --sans:'Archivo',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  --rail:60px;--r:6px;
  /* Abstands-Skala (4er-Raster) */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  /* Typo-Skala */
  --t-meta:11px;--t-sm:12.5px;--t-body:13px;--t-lg:15px;--t-title:19px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:var(--t-body);color:var(--ink-900);background:var(--paper);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:3px}
input:focus-visible,.tsearch:focus-within{outline:none}
:focus-visible{outline:2px solid var(--signal-deep);outline-offset:-2px}

/* Beleg-Strich */
.val{display:inline-flex;align-items:center;gap:6px;cursor:help}
.val::before{content:'';width:6px;height:6px;border-radius:50%;flex:none;background:transparent}
.val[data-src="echt"]::before{display:none}
.val[data-src="schaetz"]::before{background:var(--ink-300)}
.val[data-src="unsicher"]::before{background:var(--flag)}
.val[data-src="unsicher"]{color:var(--ink-700)}
.val[data-src="unbekannt"]{color:var(--ink-300);cursor:default}
.val[data-src="unbekannt"]::before{display:none}
.val[data-src="na"]{color:var(--ink-400);font-style:italic}
.val[data-src="na"]::before{display:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* Band-Meter */
.band{display:inline-flex;align-items:center;gap:6px}
.band .segs{display:inline-flex;gap:2px}
.band .segs i{width:11px;height:5px;border-radius:1px;background:var(--surface-3);display:block}
.band[data-level="hoch"] .segs i:nth-child(-n+3){background:var(--signal-deep)}
.band[data-level="mittel"] .segs i:nth-child(-n+2){background:#34C08D}
.band[data-level="niedrig"] .segs i:nth-child(-n+1){background:var(--ink-300)}
.band .lbl{font-size:12px;color:var(--ink-700);text-transform:capitalize}
td.c-band .band .lbl{display:none!important}
.band[data-level="na"] .lbl{color:var(--ink-400);font-style:italic}
td.c-band .band[data-level="na"] .segs i{background:var(--surface-3);border:1px dashed var(--line-strong);box-sizing:border-box}
td.c-band .band[data-level="na"] .lbl{display:none!important}
body[data-view="verteidigung"] .band.risk[data-level="hoch"] .segs i:nth-child(-n+3){background:var(--risk)}
body[data-view="verteidigung"] .band.risk[data-level="mittel"] .segs i:nth-child(-n+2){background:#E0A08A}

.app{display:flex;flex-direction:column;height:100vh}
.body{display:grid;grid-template-columns:var(--rail) 1fr;flex:1;min-height:0}
/* Durchgehende Kopfleiste */
.topbar{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--surface);flex:none;position:relative;z-index:40}
.brandcell{flex:none;display:flex;align-items:center;padding:0 var(--s5) 0 var(--s5);
  font-size:16px;font-weight:700;letter-spacing:-.03em;color:var(--ink-900)}
.brandcell span{color:var(--signal)}

/* Arbeitsraum: Branche als Grundraum neben der Marke */
.workspace{position:relative;flex:none;display:flex;align-items:center;padding-right:var(--s4);margin-right:var(--s2);border-right:1px solid var(--line)}
.ws-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r);transition:.14s}
.ws-chip:hover{background:var(--surface-3)}
.ws-k{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400)}
.ws-v{font-size:var(--t-sm);font-weight:600;color:var(--ink-900)}
.ws-car{font-size:9px;color:var(--ink-400)}
.ws-chip.switched .ws-v{color:var(--flag)}
.ws-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:60;min-width:280px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 12px 30px rgba(18,33,29,.16);padding:6px;display:none}
.ws-pop.open{display:block}
.ws-head{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);padding:6px 10px 8px}
.ws-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r);font-size:var(--t-body);text-align:left}
.ws-opt:hover{background:var(--surface-2)}
.ws-radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center}
.ws-opt.on .ws-radio{border-color:var(--signal)}
.ws-opt.on .ws-radio::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--signal)}
.ws-name{flex:1;min-width:0}
.ws-opt.on .ws-name{font-weight:600}
.ws-count{font-family:var(--mono);font-size:var(--t-meta);color:var(--ink-400)}
.ws-note{font-size:var(--t-meta);color:var(--ink-500);line-height:1.5;padding:8px 10px 4px;margin-top:4px;border-top:1px solid var(--line)}
.ws-reset{color:var(--signal-deep);font-weight:600;font-size:var(--t-meta)}
.ws-reset:hover{text-decoration:underline}

/* Vergabestelle-Tab */

.buyer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s5)}
.buyer-name{font-size:var(--t-lg);font-weight:700;color:var(--ink-900)}
.buyer-sub{font-size:var(--t-sm);color:var(--ink-500);margin-top:2px}
.inline-link{font-size:var(--t-sm);font-weight:600;color:var(--signal-deep);margin-left:var(--s2)}
.inline-link:hover{text-decoration:underline}
.sec-link{display:inline-flex;align-items:center;gap:6px;margin-top:var(--s3);font-size:var(--t-sm);font-weight:600;
  color:var(--signal-deep);padding:5px 0;transition:.14s}
.sec-link:hover{gap:9px}
.sec-link svg{width:14px;height:14px}
.bsec{margin-bottom:var(--s5)}
.bsec>h4{font-family:var(--mono);font-size:var(--t-meta);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-400);margin-bottom:var(--s3)}
.bstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 var(--s5);border-top:1px solid var(--line);margin-bottom:var(--s3)}
.bstat{display:flex;flex-direction:column;gap:2px;padding:var(--s3) 0;border-bottom:1px solid var(--line);min-width:0}
.bstat-wide{grid-column:span 2}
.bstat-k{font-size:var(--t-sm);color:var(--ink-500);line-height:1.35}
.bstat-v{font-size:var(--t-lg);font-weight:600;color:var(--ink-900);line-height:1.2}
.bstat-v .v-num{font-family:var(--mono);letter-spacing:-.01em}
.bstat-m{font-size:var(--t-meta);color:var(--ink-400)}
.bstat-flag{font-size:var(--t-meta);color:var(--flag);line-height:1.4;margin-top:1px}
@media (max-width:640px){.bstats{grid-template-columns:1fr}.bstat-wide{grid-column:auto}}

.bkpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);margin-bottom:var(--s3)}
.bkpi{display:flex;flex-direction:column;gap:3px;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.bkpi-k{font-size:var(--t-meta);color:var(--ink-400)}
.bkpi-v{font-size:var(--t-lg);font-weight:600;color:var(--ink-900)}
.bkpi-v .v-num{font-family:var(--mono);letter-spacing:-.01em}
.bkpi-m{font-size:var(--t-meta);color:var(--ink-400)}
.bkpi-m.up{color:var(--signal-deep)}
/* Vergabe-Profil: CPV-Mix. Neutrale Grautöne, eigenes Feld in Signalfarbe. */
.bmix{margin-bottom:var(--s3)}
.bmix-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s2);flex-wrap:wrap}
.bmix-t{font-size:var(--t-sm);font-weight:600;color:var(--ink-900)}
.bmix-basis{font-size:var(--t-meta);color:var(--ink-400)}
.bmix-body{display:flex;align-items:center;gap:var(--s6);flex-wrap:wrap}
.bmix-ring{position:relative;width:140px;height:140px;flex:none}
.donut{width:140px;height:140px;display:block}
.dseg{stroke:var(--ink-500);transition:opacity .14s}
.dseg.g1{stroke:var(--ink-400)}
.dseg.g2{stroke:var(--ink-300)}
.dseg.own{stroke:var(--signal)}
.dseg.rest{stroke:var(--line-strong)}
.bmix-ring:hover .dseg{opacity:.45}
.bmix-ring:hover .dseg:hover{opacity:1}
.bmix-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.bmix-cv{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--signal-deep);line-height:1;letter-spacing:-.02em}
.bmix-ck{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);margin-top:4px}
.bmix-list{display:flex;flex-direction:column;flex:1;min-width:240px;max-width:520px}
.bmix-row{display:grid;grid-template-columns:10px minmax(0,1fr) 44px 62px;gap:var(--s2);align-items:baseline;padding:5px 0;font-size:var(--t-sm)}
.bmix-row.own{font-weight:600}
.bmix-dot{width:8px;height:8px;border-radius:2px;background:var(--ink-500);position:relative;top:1px}
.bmix-row:nth-child(2) .bmix-dot{background:var(--ink-400)}
.bmix-row:nth-child(3) .bmix-dot{background:var(--ink-300)}
.bmix-dot.own{background:var(--signal)}
.bmix-dot.rest{background:var(--line-strong)}
.bmix-l{min-width:0;color:var(--ink-900);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bmix-you{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--signal-deep);background:var(--signal-wash);padding:1px 6px;border-radius:100px}
.bmix-p{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-900)}
.bmix-n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-400);font-size:var(--t-meta)}

.bthemes{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;padding-top:var(--s2)}
.bthemes-k{font-size:var(--t-sm);color:var(--ink-500);margin-right:var(--s1)}
.btag{font-size:var(--t-sm);padding:3px 10px;border-radius:100px;background:var(--surface-3);color:var(--ink-700)}
.bhero{display:flex;align-items:center;gap:var(--s4);padding:var(--s4);border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s3)}
.bhero-ok{border-color:var(--signal);background:var(--signal-wash)}
.bhero-mid{border-color:var(--flag);background:var(--flag-wash)}
.bhero-risk{border-color:var(--risk);background:var(--risk-wash)}
.bhero-val{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em;flex:none;min-width:76px}
.bhero-ok .bhero-val{color:var(--signal-deep)}
.bhero-mid .bhero-val{color:var(--flag)}
.bhero-risk .bhero-val{color:var(--risk)}
.bhero-lbl{display:flex;flex-direction:column;gap:4px;min-width:0}
.bhero-title{font-size:var(--t-body);font-weight:500;color:var(--ink-900);line-height:1.45}
.bhero-title b{font-weight:700}
.bconc{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:100px}
.bconc-ok{color:var(--signal-deep);background:#fff;border:1px solid var(--signal)}
.bconc-mid{color:var(--flag);background:#fff;border:1px solid var(--flag)}
.bconc-risk{color:var(--risk);background:#fff;border:1px solid var(--risk)}
.bhero-note{font-size:var(--t-sm);font-weight:400;color:var(--ink-700)}

/* Sparse-Zustand: klar von blur unterschieden — hier fehlt Datengrundlage, nicht Pro */
.v-sparse{font-size:var(--t-sm);font-style:italic;color:var(--ink-400)}

/* Volumen ehrlich zurückhaltend */
.bvolume{display:flex;align-items:flex-start;gap:var(--s5);flex-wrap:wrap;padding-top:var(--s3);margin-top:var(--s2);border-top:1px solid var(--line)}
.bvol-k{font-size:var(--t-meta);color:var(--ink-400);display:block;margin-bottom:2px}
.bvol-v{font-family:var(--mono);font-size:var(--t-body);font-weight:600;color:var(--ink-700)}
.bvol-flag{display:block;font-size:var(--t-meta);color:var(--flag);margin-top:3px}
.bvol-med{font-size:var(--t-sm);color:var(--ink-500)}
.bvol-med .v-num{font-family:var(--mono);color:var(--ink-700)}

/* Retention */
.bret{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap}
.bret-k{font-size:var(--t-sm);color:var(--ink-500);flex:1;min-width:200px}
.bret-v{font-family:var(--mono);font-size:var(--t-lg);font-weight:600;color:var(--ink-900);flex:none}
.bret-note{font-size:var(--t-sm);color:var(--ink-700);flex-basis:100%;padding-top:var(--s2);margin-top:var(--s1);border-top:1px solid var(--line)}

/* Top-Gewinner Tags */
/* Einordnungs-Skala für die Konzentration */
.bscale{margin-bottom:var(--s4)}
.bscale-track{position:relative;display:flex;height:26px;border-radius:var(--r);overflow:visible;margin-bottom:22px}
.bs-zone{flex:1;display:grid;place-items:center;font-size:var(--t-meta);font-weight:500;letter-spacing:.02em}
.bs-ok{background:var(--signal-wash);color:var(--signal-deep);border-radius:var(--r) 0 0 var(--r)}
.bs-mid{background:var(--flag-wash);color:var(--flag)}
.bs-risk{background:var(--risk-wash);color:var(--risk);border-radius:0 var(--r) var(--r) 0}
.bs-mark{position:absolute;top:-6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.bs-mark i{width:2px;height:38px;background:var(--ink-900);border-radius:2px}
.bs-mark-l{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-900);white-space:nowrap;margin-top:2px}
.bscale-ends{display:flex;justify-content:space-between;font-size:var(--t-meta);color:var(--ink-400)}

.bstats-2{border-top:1px solid var(--line);margin-bottom:var(--s3)}

.bwinners{margin-bottom:var(--s4)}
.bwin-k{display:block;font-size:var(--t-sm);color:var(--ink-500);margin-bottom:var(--s2)}
.bwin-list{display:flex;flex-direction:column;max-width:520px}
.bwin-row{display:grid;grid-template-columns:56px minmax(0,1fr) 44px 70px;gap:var(--s3);align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.bwin-row:last-child{border-bottom:none}
.bwin-bar{height:6px;border-radius:100px;background:var(--surface-3);overflow:hidden}
.bwin-bar i{display:block;height:100%;background:var(--ink-400);border-radius:100px}
.bwin-row:first-child .bwin-bar i{background:var(--ink-500)}
.bwin-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-900);font-weight:500}
.bwin-p{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-900);font-weight:600}
.bwin-c{font-size:var(--t-meta);color:var(--ink-400);text-align:right}
.bwin-c .v-num{font-family:var(--mono)}

/* Beispiel-Umschalter (Prototyp) */
.buyer-demo{display:inline-flex;align-items:center;gap:3px;background:var(--surface-3);padding:3px;border-radius:100px;flex:none}
.bd-k{font-size:9px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-400);padding:0 6px}
.bd-opt{font-size:var(--t-sm);font-weight:500;color:var(--ink-500);padding:4px 11px;border-radius:100px}
.bd-opt.on{background:var(--surface);color:var(--ink-900);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bfeed{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bfeed-row{display:grid;grid-template-columns:1.6fr 1fr 90px 16px;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);font-size:var(--t-sm);align-items:baseline}
.bfeed-link{cursor:pointer;color:inherit;text-decoration:none;transition:background .14s}
.bfeed-link:hover{background:var(--surface-2)}
.bfeed-link:hover .bf-t{color:var(--signal-deep)}
.bf-go{color:var(--ink-300);text-align:right;font-size:14px;line-height:1}
.bf-go svg{width:12px;height:12px}
.bfeed-link:hover .bf-go{color:var(--signal-deep)}
.bfeed-row:last-child{border-bottom:none}
.bfeed-head{font-family:var(--mono);font-size:var(--t-meta);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);background:var(--surface-2)}
.bf-t{min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bf-date{font-family:var(--mono);font-size:var(--t-meta);color:var(--ink-400);flex:none}
.bf-w{color:var(--ink-700);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bf-v{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-700);text-align:right}
.bf-v.unk{font-style:italic;color:var(--ink-400);font-family:var(--sans)}
.bf-flag{font-size:9px;font-weight:600;color:var(--flag);background:var(--flag-wash);padding:1px 6px;border-radius:100px;flex:none}
.buyer-floor{display:flex;align-items:flex-start;gap:var(--s2);margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);font-size:var(--t-sm);color:var(--ink-500);line-height:1.5}
.buyer-floor svg{width:15px;height:15px;color:var(--flag);flex:none;margin-top:1px}

/* Blur-Zustand: vorhanden, aber Pro — klar unterschieden von "unbekannt" (grau) */
.blur{filter:blur(5px);user-select:none;pointer-events:none;color:var(--ink-700)}
.blur-num{font-family:var(--mono);filter:blur(5px)}
.lockmark{font-size:10px;margin-left:5px;filter:grayscale(1);opacity:.6}
.probadge-lock{color:var(--ink-500);background:var(--surface-3);border-color:var(--line-strong)}
.buyer-upsell{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-top:var(--s3);padding:var(--s3) var(--s4);background:var(--note-wash);border:1px solid var(--note-line);border-radius:var(--r);font-size:var(--t-sm);color:var(--note-deep)}
.upbtn{font-size:var(--t-sm);font-weight:600;color:#fff;background:var(--note-deep);padding:5px 12px;border-radius:100px;flex:none}
.upbtn:hover{background:var(--note)}

/* Bestand: Zugehörigkeit bestätigen statt behaupten */
.bestandbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;
  padding:var(--s3) var(--s4);background:var(--surface-2);border-bottom:1px solid var(--line);flex:none}
.bestandbar[hidden]{display:none}
.bestandbar.warn{background:var(--flag-wash);border-bottom-color:var(--flag)}
.bb-main{min-width:0}
.bb-t{display:block;font-size:var(--t-body);color:var(--ink-900)}
.bb-x{display:block;font-size:var(--t-sm);color:var(--ink-500);margin-top:2px}
.bb-open{font-size:var(--t-sm);font-weight:600;color:var(--flag);white-space:nowrap;flex:none}
.bb-ok{font-size:var(--t-sm);font-weight:600;color:var(--signal-deep);white-space:nowrap;flex:none}

.owntog{width:26px;height:26px;border-radius:var(--r);border:1px solid var(--line-strong);
  font-size:15px;font-weight:600;line-height:1;color:var(--ink-500);background:var(--surface);transition:.14s}
.owntog:hover{border-color:var(--signal);color:var(--signal-deep)}
.owntog.on{background:var(--signal-wash);border-color:var(--signal);color:var(--signal-deep)}
td.c-own,th.c-own{text-align:center}
.bb-done{border-color:var(--signal);background:var(--signal);color:#fff}
.bb-done:hover{background:var(--signal-deep);border-color:var(--signal-deep)}
.bb-btn{font-size:var(--t-sm);font-weight:600;color:var(--signal-deep);border:1px solid var(--signal);
  background:var(--surface);padding:6px 13px;border-radius:100px;white-space:nowrap;flex:none;transition:.14s}
.bb-btn:hover{background:var(--signal-wash)}
.ownclaim{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;
  padding:var(--s3) var(--s4);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:var(--s3);font-size:var(--t-sm);color:var(--ink-700)}
.oc-claim{font-size:var(--t-sm);font-weight:600;color:var(--ink-900);border:1px solid var(--line-strong);
  background:var(--surface);padding:6px 13px;border-radius:var(--r);white-space:nowrap;flex:none}
.oc-claim:hover{border-color:var(--signal);color:var(--signal-deep)}
.ownconfirm{padding:var(--s4);background:var(--note-wash);border:1px solid var(--note-line);border-radius:var(--r);margin-bottom:var(--s3)}
.oc-t{font-size:var(--t-body);color:var(--note-deep);margin-bottom:var(--s2)}
.oc-x{font-size:var(--t-sm);color:var(--ink-700);line-height:1.55;margin-bottom:var(--s3)}
.oc-btns{display:flex;gap:var(--s2);flex-wrap:wrap}
.oc-yes{font-size:var(--t-sm);font-weight:600;color:#fff;background:var(--note-deep);padding:7px 14px;border-radius:var(--r)}
.oc-yes:hover{background:var(--note)}
.oc-no{font-size:var(--t-sm);font-weight:500;color:var(--ink-700);border:1px solid var(--line-strong);padding:7px 14px;border-radius:var(--r)}
.oc-no:hover{border-color:var(--ink-400)}
.oc-tag{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--signal-deep);background:var(--signal-wash);padding:1px 7px;border-radius:100px;margin-left:8px}

/* Inhalt links, ein einziger Freischalt-Hinweis rechts */
.gatelayout{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:var(--s6);align-items:start}
.gatelayout.solo{grid-template-columns:minmax(0,1fr)}
.gatemain{min-width:0}
.gateside{min-width:0}
.gatecard{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2);
  padding:var(--s4);background:var(--note-wash);border:1px solid var(--note-line);border-radius:var(--r)}
.gc-lock{color:var(--note-deep);opacity:.8}
.gc-lock svg{width:20px;height:20px}
.gc-t{font-size:var(--t-body);font-weight:700;color:var(--note-deep)}
.gc-x{font-size:var(--t-sm);color:var(--ink-700);line-height:1.5}
.gc-btn{width:100%;margin-top:var(--s1);font-size:var(--t-sm);font-weight:600;color:#fff;
  background:var(--note-deep);padding:8px 12px;border-radius:var(--r);transition:.14s}
.gc-btn:hover{background:var(--note)}
.gc-p{font-size:var(--t-meta);color:var(--ink-500)}
@media (max-width:820px){.gatelayout{grid-template-columns:minmax(0,1fr)}}

/* Markt-Dossier (Tab im Lead-Detail) */

.mbody{padding:var(--s5) var(--s6);max-width:1120px}
.msub-k{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);margin-bottom:3px}
.tab[data-weak]{opacity:.5}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap}
.mtitle{font-size:var(--t-title);font-weight:700;letter-spacing:-.02em;color:var(--ink-900)}
.msub{font-size:var(--t-sm);color:var(--ink-500);margin-top:3px}
.msec{margin-bottom:var(--s5)}
.msec>h4{font-family:var(--mono);font-size:var(--t-meta);font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-400);margin-bottom:var(--s3)}
.rstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s5);border-top:1px solid var(--line)}
.rstats.dimmed{opacity:.55}
.rstat{display:flex;flex-direction:column;gap:2px;padding:var(--s3) 0;border-bottom:1px solid var(--line);min-width:0}
.rstat-k{font-size:var(--t-sm);color:var(--ink-500);line-height:1.35}
.rstat-v{font-size:var(--t-lg);font-weight:600;color:var(--ink-900);line-height:1.2}
.rstat-v .v-num{font-family:var(--mono);letter-spacing:-.01em}
.rstat-med{font-size:var(--t-meta);color:var(--signal-deep);background:var(--signal-wash);
  align-self:flex-start;padding:1px 7px;border-radius:100px;margin-top:2px}
.rstat-med .v-num{font-family:var(--mono);font-weight:600}
.rstat-note{font-size:var(--t-meta);color:var(--ink-400);line-height:1.4;margin-top:2px}
.stand{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-400);border:1px solid var(--line);padding:0 5px;border-radius:100px;margin-left:4px;white-space:nowrap}
.rvol{display:flex;flex-direction:column;gap:2px;padding-top:var(--s3);margin-top:var(--s2)}
.rvol-v{font-size:var(--t-lg);font-weight:600;color:var(--ink-700)}
.rvol-v .v-num{font-family:var(--mono)}
.mfoot-note{font-size:var(--t-sm);color:var(--ink-700);line-height:1.6;margin-top:var(--s3);
  padding:var(--s3) var(--s4);background:var(--surface-2);border-left:2px solid var(--line-strong);border-radius:0 var(--r) var(--r) 0}
.mfoot-note b{color:var(--ink-900)}
.mnote{font-size:var(--t-sm);color:var(--ink-700);line-height:1.55;padding:var(--s3) var(--s4);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s3)}
.mwarn{display:flex;align-items:flex-start;gap:var(--s2);font-size:var(--t-sm);line-height:1.55;color:var(--ink-700);
  padding:var(--s3) var(--s4);background:var(--flag-wash);border:1px solid var(--flag);border-radius:var(--r);margin-bottom:var(--s5)}
.mwarn svg{width:16px;height:16px;color:var(--flag);flex:none;margin-top:2px}
@media (max-width:640px){.rstats{grid-template-columns:1fr}}

/* Leerer Tabellenzustand */
.emptyrow td{padding:var(--s6) var(--s4)!important;text-align:center}
.empty-t{font-size:var(--t-body);color:var(--ink-500);line-height:1.6;max-width:52ch;margin:0 auto}
.empty-t b{display:block;color:var(--ink-900);margin-bottom:4px;font-weight:600}

/* Rail */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;transition:background .35s}
body[data-view="verteidigung"] .rail{background:var(--ink-900);border-right-color:var(--ink-900)}
.mark{width:32px;height:32px;border-radius:8px;background:var(--signal);display:grid;place-items:center;margin-bottom:18px;flex:none}
.mark svg{width:16px;height:16px}
.viewbtn{width:44px;padding:11px 0;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink-400);transition:.18s;position:relative}
.viewbtn svg{width:19px;height:19px;stroke-width:1.6}
.viewbtn b{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}
.viewbtn:hover{color:var(--ink-700);background:var(--surface-3)}
.viewbtn[aria-current="true"]{background:var(--signal-wash);color:var(--signal-deep)}
body[data-view="verteidigung"] .viewbtn{color:#6E837B}
body[data-view="verteidigung"] .viewbtn:hover{background:#1D332C;color:#C9D6D0}
body[data-view="verteidigung"] .viewbtn[aria-current="true"]{background:#1D332C;color:#FFF}
.railfoot{margin-top:auto;display:flex;flex-direction:column;align-items:center;padding-bottom:2px}
.planbadge{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;width:44px;border-radius:var(--r);color:var(--ink-500);transition:.15s}
.planbadge:hover{background:var(--surface-3)}
.plan-ring{width:22px;height:22px;border-radius:50%;border:2px solid var(--signal);display:grid;place-items:center;position:relative}
.plan-ring::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--signal)}
.planbadge.free .plan-ring{border-color:var(--ink-300)}
.planbadge.free .plan-ring::after{background:transparent}
.plan-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-700)}
.planbadge.free .plan-lbl{color:var(--ink-400)}
body[data-view="verteidigung"] .planbadge{color:#8FA69D}
body[data-view="verteidigung"] .planbadge:hover{background:#1D332C}
body[data-view="verteidigung"] .plan-lbl{color:#C9D6D0}
.railcount{position:absolute;top:4px;right:2px;min-width:15px;height:15px;padding:0 4px;border-radius:100px;background:var(--ink-900);color:#fff;font-family:var(--mono);font-size:9px;font-weight:600;display:grid;place-items:center}
.raildot{position:absolute;top:8px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--signal);border:1.5px solid var(--surface)}
body[data-view="verteidigung"] .railcount{background:var(--signal);color:var(--ink-900)}
body[data-view="verteidigung"] .raildot{border-color:var(--ink-900)}

/* Main = horizontaler Split */
.main{display:grid;grid-template-rows:1fr 6px 34vh;min-height:0;
  transition:grid-template-rows .34s cubic-bezier(.4,0,.2,1)}
.main.dragging{transition:none}
body[data-mode="browse"] .main{grid-template-rows:1fr 6px 34vh}
body[data-mode="read"]   .main{grid-template-rows:22vh 6px 1fr}
body[data-mode="full"]   .main{grid-template-rows:0 6px 1fr}
.divider{background:var(--line);cursor:row-resize;position:relative}
.divider::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:2px;border-radius:2px;background:var(--line-strong)}
.divider:hover{background:var(--line-strong)}

/* Tabellen-Bereich */
.tablewrap{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
/* Toolbar rechts neben der Marke; Filterleiste wächst darunter in dieselbe Kopfleiste */
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:var(--s2);height:52px;padding:0 var(--s4) 0 0;flex:none}
.brandmk{font-size:17px;font-weight:700;letter-spacing:-.03em;margin-right:4px}
.brandmk span{color:var(--signal)}
.tsearch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:8px 12px;width:600px;max-width:52vw;transition:border-color .15s,box-shadow .15s,background .15s}
.tsearch:focus-within{background:var(--surface);border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-wash)}
.tsearch svg{width:15px;height:15px;color:var(--ink-400);flex:none}
.tsearch input{border:none;background:none;outline:none;font:inherit;font-size:13.5px;width:100%}
.tkbd{font-family:var(--mono);font-size:11px;color:var(--ink-400);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none}
.tsearch:focus-within .tkbd{display:none}

/* Suchvorschläge */
.searchwrap{position:relative;flex:none}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:60;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 12px 30px rgba(18,33,29,.14);
  padding:5px;display:none;max-height:320px;overflow:auto}
.suggest.open{display:block}
.sugg{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:6px;text-align:left;font-size:13px}
.sugg:hover,.sugg.hl{background:var(--surface-2)}
.sugg-ic{width:15px;height:15px;color:var(--ink-400);flex:none}
.sugg-ic svg{width:15px;height:15px}
.sugg-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg-cat{font-size:10.5px;color:var(--ink-400);font-family:var(--mono);letter-spacing:.02em;flex:none}
.sugg-raw{border-top:1px solid var(--line);margin-top:3px;padding-top:9px;color:var(--ink-500)}

/* Facetten-Knöpfe */
.facet{position:relative;flex:none}
.facetbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-700);
  padding:7px 10px;border-radius:7px;border:1px solid transparent;background:transparent;transition:.14s;white-space:nowrap}
.facetbtn:hover{background:var(--surface-3)}
.facet .facetbtn.active,.facetbtn.active{border-color:var(--ink-900);color:var(--ink-900)}
.facetbtn.active{background:var(--surface-2)}
.fcar{font-size:9px;color:var(--ink-400)}
.fbadge{min-width:16px;height:16px;padding:0 4px;border-radius:100px;background:var(--ink-900);color:#fff;
  font-family:var(--mono);font-size:9px;font-weight:600;display:none;place-items:center}
.facetpop{position:absolute;left:0;top:calc(100% + 6px);z-index:60;min-width:190px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 12px 30px rgba(18,33,29,.14);padding:6px;display:none}
.facetpop.open{display:block}
.facetpop-wide{min-width:250px}
.facetopt,.regopt{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:6px;font-size:13px;text-align:left}
.facetopt:hover,.regopt:hover{background:var(--surface-2)}
.fbox{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:4px;flex:none;display:grid;place-items:center}
.facetopt.on .fbox,.regopt.on .fbox{background:var(--signal);border-color:var(--signal)}
.facetopt.on .fbox::after,.regopt.on .fbox::after{content:'';width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.regsearch{padding:2px 2px 7px}
.regsearch input{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;font:inherit;font-size:13px;outline:none}
.regsearch input:focus{border-color:var(--signal)}
.reglist{max-height:200px;overflow:auto}
.reghint{font-size:11px;color:var(--ink-400);padding:8px 9px 3px;border-top:1px solid var(--line);margin-top:4px}

.tsep{width:1px;height:22px;background:var(--line);flex:none;margin:0 2px}

/* Radius am Ort-Token */
.ftoken{position:relative}
.tok-lbl{white-space:nowrap}
.tok-rad{font-size:11px;font-weight:600;color:var(--signal-deep);padding:2px 6px;border-radius:100px;background:#fff;border:1px solid #BCE7D7;margin-left:2px}
.tok-rad:hover{border-color:var(--signal)}
.radmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:60;display:flex;gap:4px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:100px;box-shadow:0 8px 22px rgba(18,33,29,.14);padding:4px}
.radopt{font-family:var(--mono);font-size:11px;font-weight:500;padding:4px 9px;border-radius:100px;color:var(--ink-700)}
.radopt:hover{background:var(--surface-2)}
.radopt.on{background:var(--signal);color:#fff}
.tok-x{width:16px;height:16px;display:grid;place-items:center;border-radius:50%;color:var(--ink-400);font-size:14px;line-height:1}
.tok-x:hover{background:var(--surface-3);color:var(--ink-900)}

/* Filterleiste unter der Toolbar */
.filterbar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;padding:0 var(--s4) var(--s3);background:var(--surface);flex:none}
.filterbar.empty{display:none}
.fb-label{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-400);margin-right:2px}
.ftoken{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 5px 4px 11px;border-radius:100px;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-900)}
.ftoken svg{width:12px;height:12px;flex:none}
.ftoken-ort{background:var(--signal-wash);border-color:#BCE7D7;color:var(--signal-deep)}
.ftoken-cpv{background:#EEF2F6;border-color:#D3DDE6;color:#3A5A75}
.ftoken button{width:16px;height:16px;display:grid;place-items:center;border-radius:50%;color:var(--ink-400);font-size:14px;line-height:1}
.ftoken button:hover{background:var(--surface-3);color:var(--ink-900)}
.ftoken-ort button:hover{background:#CDEEE1}
.fb-clear{font-size:11.5px;color:var(--ink-500);font-weight:500;margin-left:4px}
.fb-clear:hover{color:var(--flag)}

.tstatus{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.tcount{font-family:var(--mono);font-size:12px;color:var(--ink-500);white-space:nowrap}
.tcount b{color:var(--ink-900);font-weight:600}
.markread{display:inline-flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);font-weight:500;color:var(--ink-500);padding:var(--s2) 10px;border-radius:var(--r);border:1px solid transparent;background:transparent;white-space:nowrap;transition:.14s}
.markread:hover{background:var(--surface-3);color:var(--signal-deep)}
.markread svg{width:14px;height:14px}
.markread svg,.markread span{pointer-events:none}
.markread[disabled]{opacity:.4;pointer-events:none}
.tchip{font-size:var(--t-sm);font-weight:500;padding:var(--s2) 10px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--ink-700);transition:.14s;white-space:nowrap}
.tchip:hover{background:var(--surface-3)}
.tchip[aria-pressed="true"]{background:var(--ink-900);color:#fff}
.tchip .dot{display:none}
.tchip .n{font-family:var(--mono);font-size:10px}
.colcfg{position:relative}
.colbtn{font-size:var(--t-sm);font-weight:500;padding:var(--s2) 10px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--ink-500);display:inline-flex;gap:var(--s2);align-items:center;white-space:nowrap}
.colbtn:hover{background:var(--surface-3);color:var(--ink-900)}
.colmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 12px 30px rgba(18,33,29,.14);padding:6px;min-width:190px;display:none}
.colmenu[data-open]{display:block}
.colmenu .ci{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:5px;font-size:12.5px;cursor:pointer}
.colmenu .ci:hover{background:var(--surface-2)}
.colmenu .box{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;flex:none}
.colmenu .ci[data-on] .box{background:var(--signal);border-color:var(--signal)}
.colmenu .ci[data-on] .box::after{content:'';width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.colmenu .ci[data-locked]{opacity:.5;cursor:not-allowed}

.tablescroll{overflow:auto;flex:1;min-height:0}
table.leads{width:100%;border-collapse:collapse;font-size:13px}
.leads thead th{
  position:sticky;top:0;z-index:1;background:var(--surface-2);
  font-family:var(--mono);font-size:var(--t-meta);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-400);font-weight:600;text-align:left;padding:var(--s2) var(--s3);
  border-bottom:1px solid var(--line-strong);white-space:nowrap;cursor:pointer;user-select:none;
}
.leads thead th:hover{color:var(--ink-700)}
.leads thead th .ar{opacity:0;margin-left:3px}
.leads thead th[draggable]{cursor:grab}
.leads thead th.dragging{opacity:.4;cursor:grabbing}
.leads thead th.drop-l{box-shadow:inset 2px 0 0 var(--signal)}
.leads thead th.drop-r{box-shadow:inset -2px 0 0 var(--signal)}
.leads thead th.has-filter{position:sticky}
.leads thead th .th-lbl{vertical-align:middle}
.thfilter{position:relative;display:inline-flex;align-items:center;gap:2px;margin-left:5px;padding:2px;border-radius:4px;color:var(--ink-300);vertical-align:middle}
.thfilter svg{width:12px;height:12px}
.thfilter:hover{background:var(--surface-3);color:var(--ink-700)}
.thfilter.on{color:var(--signal-deep)}
.thfn{font-family:var(--mono);font-size:9px;font-weight:600}
.headpop{position:absolute;left:0;top:calc(100% + 8px);z-index:60;min-width:180px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 12px 30px rgba(18,33,29,.16);padding:6px;
  display:none;text-transform:none;letter-spacing:normal}
.headpop.open{display:block}
.headpop .reglist{max-height:220px;overflow:auto}
.leads thead th[data-sorted] .ar{opacity:1;color:var(--signal-deep)}
.leads thead th.right{text-align:right}
.leads thead th.center{text-align:center}
.leads tbody td{padding:var(--s3) var(--s3);border-bottom:1px solid var(--line);vertical-align:middle}
td.c-band{width:78px;text-align:center}
td.c-band .band{justify-content:center;gap:0}

.leads tbody tr{cursor:pointer}
.leads tbody tr:hover{background:var(--surface-2)}
.leads tbody tr[aria-selected="true"]{background:var(--signal-wash);box-shadow:inset 3px 0 0 var(--signal)}
body[data-view="verteidigung"] .leads tbody tr[aria-selected="true"]{background:var(--surface-3);box-shadow:inset 3px 0 0 var(--ink-900)}

td.c-star{width:30px;text-align:center;padding-right:0}
.tstar{color:var(--ink-300);opacity:.45}
.tstar[data-merk]{opacity:1}
.tstar[data-merk="manuell"]{color:var(--ink-900)}
.tstar svg{width:14px;height:14px;stroke-width:1.7;vertical-align:middle}
.tstar[data-merk="manuell"] svg{fill:var(--ink-900)}
.tstar[data-merk="auto"]{color:var(--ink-400)}

td.c-src{width:96px}
.srcpill{font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:3px 9px;border-radius:100px;border:1px solid transparent}
.srcpill::before{content:'';width:6px;height:6px;border-radius:50%;flex:none}
.src-auslauf{background:#EDF1F7;color:#33507D}.src-auslauf::before{background:#3A6099}
.src-f02{background:#EBF3EE;color:#2C5E43}.src-f02::before{background:#2F6B4A}
.src-f01{background:#F7F0E6;color:#835616}.src-f01::before{background:#A2691E}

td.c-titel{min-width:280px;max-width:440px}
.ttitel{font-weight:600;color:var(--ink-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
tr[data-unread]{background:var(--unread-wash,#F0F8F4)}
tr[data-unread] .ttitel{font-weight:600}
tr[data-unread] td:first-child{box-shadow:inset 3px 0 0 var(--signal)}
tr.gesichtet .ttitel{font-weight:500;color:var(--ink-700)}
tr[data-unread][aria-selected="true"]{background:var(--surface-3)}

td.c-buyer{color:var(--ink-500);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
td.c-frist{white-space:nowrap}
.cd{display:inline-flex;flex-direction:column;line-height:1.15}
.cd .val{font-size:12px}
.cd .cdsub{font-size:9.5px;color:var(--ink-400);letter-spacing:.02em;margin-top:2px}
.cd.urg .val{color:var(--flag);font-weight:600}
.cd.none .val,.cd.none{color:var(--ink-300)}

td.c-natur{white-space:nowrap}
.nat{font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:3px 9px;border-radius:100px;border:1px solid transparent}
.nat::before{content:'';width:6px;height:6px;border-radius:50%;flex:none}
.nat-dienst{background:#EDF1F6;color:#365574}.nat-dienst::before{background:#3A5A75}
.nat-liefer{background:#F2EEF6;color:#614579}.nat-liefer::before{background:#6A4E7A}
.nat-bau{background:#F5F0E7;color:#6E5A34}.nat-bau::before{background:#7A6640}

td.c-konk{white-space:nowrap}
.kf{display:inline-flex;align-items:center;gap:7px}
.kf .val{font-size:12px}
.kf .ksegs{display:inline-flex;gap:2px}
.kf .ksegs i{width:6px;height:12px;border-radius:1px;background:var(--surface-3);display:block}
/* wenige Bieter = wenig Konkurrenz = gut (grün), viele = Gedränge (rot) */
.kf-gering .ksegs i:nth-child(-n+1){background:var(--signal)}
.kf-mittel .ksegs i:nth-child(-n+2){background:var(--flag)}
.kf-hoch   .ksegs i:nth-child(-n+3){background:var(--risk)}
.kf-none{font-size:11px;color:var(--ink-400);font-style:italic}

td.c-neu{white-space:nowrap}
.wettb{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:100px}
.wettb.neu{background:var(--signal-wash);color:var(--signal-deep)}
.wettb.folge{background:var(--surface-3);color:var(--ink-500)}
td.c-vol{text-align:right;white-space:nowrap}
td.c-region{color:var(--ink-500);font-size:12px;white-space:nowrap}
td.c-inc{color:var(--ink-700);font-size:12px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
td.c-status{white-space:nowrap}
.stat{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-400)}
.hidecol{display:none}

/* Detail unten */
.detail{overflow-y:auto;min-height:0;background:var(--paper);position:relative}
.dactions{display:flex;align-items:center;gap:var(--s2);flex:none}
.danalysemeter{display:inline-flex;align-items:baseline;gap:6px;font-size:var(--t-meta)}
.dam-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-400)}
.dam-val{font-weight:600;color:var(--ink-700)}
.dam-val.out{color:var(--flag)}
.dam-val.pro{color:var(--note-deep)}
.dactsep{width:1px;height:16px;background:var(--line);margin:0 2px}
.dbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-400);transition:.14s}
.dbtn:hover{background:var(--surface-3);color:var(--ink-900)}
.dbtn svg{width:15px;height:15px}
.dbtn-star svg{width:16px;height:16px}
.dbtn-star[data-merk] svg{fill:var(--signal);stroke:var(--signal)}
.dbtn-star[data-merk]{color:var(--signal-deep)}
.seen-mark{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--signal-deep);background:var(--signal-wash);padding:2px 7px;border-radius:100px}
.dhead{background:var(--surface);border-bottom:1px solid var(--line);padding:var(--s3) var(--s6) 0;position:sticky;top:0;z-index:5}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s3)}
.dhead .eyebrow{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);color:var(--ink-500);min-width:0}
.dtitle{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s3)}
.dtitle .wfpick{margin-bottom:0;flex:none}
.dhead .eyebrow .eb-sep{color:var(--ink-300)}
.dhead h2{font-size:var(--t-title);font-weight:700;line-height:1.25;letter-spacing:-.02em;max-width:60ch;margin:0;flex:1;min-width:0}
.dsub{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--ink-500);margin-bottom:12px;flex-wrap:wrap}
.dsub a{color:var(--signal-deep);text-decoration:none;border-bottom:1px solid var(--signal-wash)}
.srcpill.big{font-size:12px;padding:3px 10px}
.tabs{display:flex;gap:2px}
.tab{padding:9px 15px;font-size:var(--t-sm);font-weight:600;color:var(--ink-500);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink-900)}
.tab[aria-selected="true"]{color:var(--ink-900);border-bottom-color:var(--ink-900)}
.tab .quota{font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--ink-400);margin-left:5px}
.tab .quota.out{color:var(--flag);font-weight:600}
.tab .probadge{margin-left:5px}
.dbody{padding:var(--s5) var(--s6);max-width:1120px}
/* Inhaltsspalte ist in jedem Tab gleich breit; Seitenspalten sitzen daneben */
.kv,.anagrid,.gatemain,.teamgrid,
.buyer-head,.mhead,.buyer-floor,.prov-legend,.mwarn{max-width:820px}
.sec{margin-bottom:var(--s5)}
.sec>h4{font-family:var(--mono);font-size:var(--t-meta);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-400);margin-bottom:var(--s3);display:flex;gap:var(--s2);align-items:baseline}
.sec>h4 .cov{margin-left:auto;letter-spacing:.02em;text-transform:none;font-weight:400;color:var(--ink-400)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
/* Übersicht: gerahmte Blöcke wie die Analyse */
.ovgrid{display:block}
.dbody-ana{position:relative;padding-right:calc(200px + var(--s6) + var(--s6))}
.anagrid{min-width:0}
.anagrid>.sec{margin-bottom:var(--s5);scroll-margin-top:var(--s4)}
.ananav{position:absolute;top:0;right:var(--s6);width:200px;display:flex;flex-direction:column;gap:1px;will-change:transform}
.ananav .anav-item{text-align:left;font-size:var(--t-sm);color:var(--ink-400);padding:6px 10px;border-radius:var(--r);border-left:2px solid transparent;transition:.14s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ananav .anav-item:hover{color:var(--ink-700);background:var(--surface-3)}
.ananav .anav-item.on{color:var(--ink-900);font-weight:600;border-left-color:var(--signal);background:var(--surface-2)}
@media (max-width:820px){.dbody-ana{padding-right:var(--s6)}.ananav{display:none}}
.kv{display:flex;flex-direction:column}
.kvi{display:flex;align-items:baseline;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--line);min-width:0}
.kvi:last-child{border-bottom:none}
.kvi .k{font-size:var(--t-body);color:var(--ink-500);width:200px;flex:none}
.kvi .vv{display:flex;align-items:baseline;gap:6px;min-width:0;flex:1;flex-wrap:wrap}
.kvi .v{font-size:var(--t-body);color:var(--ink-900);font-weight:500}
.kvi-lead .v{font-size:var(--t-body);font-weight:600}
.kvi .v-num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kvi .v-unk{color:var(--ink-400);font-weight:400}
.kvi .v-na{color:var(--ink-400);font-style:italic;font-weight:400}
.kvi .vm{font-size:var(--t-meta);color:var(--ink-400);flex:none;margin-left:auto;padding-left:var(--s3)}
.kvi .tag-neu{font-size:var(--t-body);color:var(--signal-deep);font-weight:600}
.kvi .tag-folge{font-size:var(--t-body);color:var(--ink-900);font-weight:600}

@media (max-width:560px){.kvi{flex-direction:column;gap:3px}.kvi .k{width:auto}.kvi .vm{margin-left:0}}

/* Übersicht als Datenblatt — eine Werteschrift, ruhige Herkunft */
.facts{margin-bottom:26px}
.facts .fact{display:grid;grid-template-columns:168px 1fr;gap:16px;align-items:baseline;
  padding:9px 2px;border-bottom:1px solid var(--line)}
.facts .fact:last-child{border-bottom:none}
.facts dt{font-size:12px;color:var(--ink-500);font-weight:400}
.facts dd{display:flex;align-items:baseline;gap:8px;min-width:0}
.facts .v{font-size:13px;color:var(--ink-900);font-weight:500}
.facts .v-num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.facts .fact-lead .v{font-size:15px;font-weight:600;letter-spacing:-.01em}
.facts .v-unk{color:var(--ink-400);font-weight:400}
.facts .v-na{color:var(--ink-400);font-style:italic;font-weight:400}
.facts .meta{font-size:11px;color:var(--ink-400);flex:none;padding-left:2px}
.tag-neu{font-size:14px;color:var(--signal-deep);font-weight:600}
.tag-folge{font-size:14px;color:var(--ink-900);font-weight:600}

/* Herkunfts-Punkt: nur wo NICHT gemessen. Belegtes bleibt unmarkiert. */
.pdot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block;cursor:help;position:relative;top:-1px;margin-left:2px}
.pdot-schaetz{background:var(--ink-300)}
.pdot-unsicher{background:var(--flag)}
.pdot-unbekannt{background:transparent}
.note-box .pdot{margin-right:6px;vertical-align:middle}

.prov-legend{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s5);padding-top:var(--s4);
  border-top:1px solid var(--line);font-size:var(--t-meta);color:var(--ink-500)}
.prov-legend .pdot{margin-left:6px}
.prov-legend .pdot:first-child{margin-left:0}
.prov-legend .pl-unk{color:var(--ink-400);margin-left:6px}
.prov-legend .pl-plain{color:var(--ink-400);margin-left:auto}
@media (max-width:560px){.facts .fact{grid-template-columns:1fr;gap:3px}.facts .meta{margin-left:0}}
.cell{background:var(--surface);padding:13px 15px}
.cell dt{font-size:11px;color:var(--ink-500);margin-bottom:5px}
.cell dd{font-size:15px;font-weight:600;letter-spacing:-.01em}
.cell dd .num{font-size:15px;font-weight:500}
.cell .note{font-size:10.5px;color:var(--ink-400);margin-top:5px;line-height:1.35}
.tedlink{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--signal-deep);text-decoration:none;border-bottom:2px solid var(--signal-wash);padding-bottom:1px}
.tedlink:hover{border-bottom-color:var(--signal)}
.tedlink svg{width:13px;height:13px}
.scores{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.score{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.score:last-child{border-bottom:none}
.score .name{font-size:var(--t-body);font-weight:600;width:140px;flex:none}
.score .band .segs i{width:20px;height:6px}
.score .band .lbl{display:none}
.score[data-level="na"] .band .lbl{color:var(--ink-400);font-weight:400}
/* Pro-Abzeichen am Tab */
.probadge{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--note-deep);background:var(--note-wash);border:1px solid var(--note-line);
  padding:1px 5px;border-radius:100px;vertical-align:middle}

/* Kontakt als Handlungsraum am Ende der Analyse */
.contact{border:1px solid var(--note-line);border-radius:var(--r);background:var(--note-wash);padding:var(--s4) var(--s4) var(--s3)}
.ct-row{display:flex;align-items:baseline;gap:var(--s4);padding:var(--s2) 0;border-bottom:1px solid var(--note-line)}
.ct-row:first-child{padding-top:0}
.ct-k{font-size:var(--t-body);color:var(--note-deep);width:184px;flex:none}
.ct-v{font-size:var(--t-body);color:var(--ink-900);font-weight:500}
.ct-note{font-size:var(--t-sm);color:var(--ink-500);line-height:1.5;margin-top:var(--s3)}

.score .why{margin-left:auto;font-size:var(--t-sm);color:var(--ink-500);text-align:right;max-width:44ch}
.score .scoreword{margin-left:auto;font-size:var(--t-body);font-weight:600;text-transform:capitalize;color:var(--ink-700)}
.score[data-level="na"] .scoreword{color:var(--ink-400);font-weight:400}
.score .why .ok{color:var(--signal-deep);font-weight:600}.score .why .no{color:var(--flag);font-weight:600}
.score-caveat{display:flex;align-items:flex-start;gap:var(--s2);margin-top:var(--s3);padding:var(--s3) var(--s4);
  background:var(--flag-wash);border:1px solid var(--flag);border-radius:var(--r);
  font-size:var(--t-sm);color:var(--ink-700);line-height:1.55}
.score-caveat .pdot{margin-top:6px}
.score-note{display:grid;grid-template-columns:140px auto 1fr;gap:var(--s3);align-items:baseline;
  margin-top:var(--s3);padding:var(--s3) var(--s4);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r)}
@media (max-width:720px){.score-note{grid-template-columns:1fr;gap:5px}}
.score-note .sn-label{font-size:var(--t-sm);color:var(--ink-500)}
.score-note .sn-val{font-size:var(--t-body);font-weight:600}
.score-note .sn-val .unk{font-weight:400;font-style:italic;color:var(--ink-400);font-size:var(--t-sm)}
.score-note .sn-txt{font-size:var(--t-sm);color:var(--ink-500);line-height:1.45}
@media (max-width:640px){.score-note{grid-template-columns:1fr;gap:5px}}
.cmp{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cmp th,.cmp td{padding:var(--s2) var(--s4);text-align:left;border-bottom:1px solid var(--line);font-size:var(--t-body)}
.cmp thead th{font-family:var(--mono);font-size:var(--t-meta);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);font-weight:600;background:var(--surface-2)}
.cmp tbody tr:last-child td,.cmp tbody tr:last-child th{border-bottom:none}
.cmp td.me,.cmp td.them{font-family:var(--mono);font-variant-numeric:tabular-nums;width:88px}
.cmp td.me{font-weight:600}.cmp td.edge{width:34px;text-align:center}
.cmp .up{color:var(--signal-deep)}.cmp .down{color:var(--flag)}
.cmp tbody th{font-weight:500;color:var(--ink-700)}
.cmpfoot{font-size:var(--t-meta);color:var(--ink-400);margin-top:var(--s2);display:flex;gap:var(--s4);flex-wrap:wrap}
.reqs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.req{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);font-size:var(--t-body)}
.req:last-child{border-bottom:none}
.req .mk{width:16px;flex:none;font-weight:700;text-align:center}
.req .mk.y{color:var(--signal-deep)}.req .mk.n{color:var(--flag)}.req .mk.q{color:var(--ink-300)}
.req .code{font-family:var(--mono);font-size:var(--t-sm);color:var(--ink-700);width:64px;flex:none}
.req .lbl{font-weight:500;flex:1;min-width:0}.req .st{margin-left:auto;font-size:var(--t-sm);color:var(--ink-500);flex:none;text-align:right}
.reqsum{padding:var(--s3) var(--s4);background:var(--surface-2);border-top:1px solid var(--line);font-size:var(--t-sm);color:var(--ink-700);display:flex;gap:var(--s2)}
.reqsum b{font-family:var(--mono);font-weight:600}
.note-box{border:1px solid var(--line);border-left:3px solid var(--ink-300);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:var(--s3) var(--s4);font-size:12.5px;color:var(--ink-700);line-height:1.55}
.note-box.gap{border-left-color:var(--flag);background:var(--flag-wash)}
.note-box.build{border-left-color:var(--ink-300);background:var(--surface-2);color:var(--ink-500)}
.note-box b{font-weight:600;color:var(--ink-900)}
.note-box .acts{margin-top:9px;display:flex;gap:8px}
.note-box .acts button{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:100px;border:1px solid var(--line-strong);background:var(--surface)}
.contracts{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ct{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);font-size:var(--t-body)}
.ct:last-of-type{border-bottom:none}
.ct .t{font-weight:500;flex:1;min-width:0}
.ct .v{font-family:var(--mono);font-size:var(--t-sm);color:var(--ink-700);width:120px;flex:none;text-align:right}
.ct .e{font-family:var(--mono);font-size:var(--t-sm);color:var(--ink-500);width:96px;flex:none;text-align:right}
.gate{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:26px 32px;text-align:center;max-width:520px;margin:24px auto}
.gate .lock{width:32px;height:32px;margin:0 auto 12px;color:var(--ink-300)}
.gate h3{font-size:16px;font-weight:700;margin-bottom:8px}
.gate p{font-size:13px;color:var(--ink-500);line-height:1.6;margin-bottom:16px}
.gate .cta{background:var(--ink-900);color:#fff;font-size:13px;font-weight:600;padding:9px 20px;border-radius:100px}
.gate .alt{display:block;margin-top:12px;font-size:12px;color:var(--ink-500)}
.legend{display:flex;gap:18px;align-items:center;font-size:11px;color:var(--ink-500)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:0;border-bottom:2px solid;display:block}
.lg-echt{border-color:var(--signal)!important}.lg-sch{border-bottom-style:dashed!important;border-color:var(--ink-300)!important}
.lg-uns{border-bottom-style:dotted!important;border-color:var(--flag)!important}
.lg-unb{border-color:transparent!important;position:relative}.lg-unb::after{content:'—';position:absolute;top:-11px;left:2px;color:var(--ink-300)}

.wf{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.01em}
/* Alle Status-Labels gleich: neutraler Umriss; gewählt = gefüllt */
.wf{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-700)}
.wf-int.on,.wf-int.filled{background:var(--note);border-color:var(--note);color:#fff}
.wf-pru.on,.wf-pru.filled{background:var(--note);border-color:var(--note);color:#fff}
.wf-fra.on,.wf-fra.filled{background:var(--note);border-color:var(--note);color:#fff}
.wf-ver.on,.wf-ver.filled{background:var(--ink-700);border-color:var(--ink-700);color:#fff}
.wf-none{color:var(--ink-300)}
td.c-wf{white-space:nowrap}
tr.wf-verworfen .ttitel{color:var(--ink-400);text-decoration:line-through;text-decoration-color:var(--ink-300)}

.wfpick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.wfpick .wf{cursor:pointer;transition:.14s}
.wfpick .wf:hover{border-color:var(--note)}
.wfpick .wf.on{box-shadow:0 0 0 2px var(--note-wash)}
.wfpick .wf-clear{font-size:11px;color:var(--ink-400);padding:3px 6px}
.wfpick .wf-clear:hover{color:var(--flag)}

/* Team-Tab Layout */
.teamgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--s5);align-items:start}
@media (max-width:820px){.teamgrid{grid-template-columns:1fr;gap:20px}}
.teamcol>h4{font-family:var(--mono);font-size:var(--t-meta);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-400);padding-bottom:var(--s2);margin-bottom:var(--s3);border-bottom:1px solid var(--line);display:flex;gap:var(--s2)}
.teamcol>h4 .cov{margin-left:auto;letter-spacing:.02em;text-transform:none;font-weight:400;color:var(--ink-400)}

/* Verlauf */
.log{display:flex;flex-direction:column}
.logrow{display:flex;align-items:baseline;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.logrow:last-child{border-bottom:none}
.logmark{font-size:9px;color:var(--ink-300);width:12px;text-align:center;flex:none}
.logrow[data-kind="analyze"] .logmark{color:var(--signal-deep)}
.logrow[data-kind="status"] .logmark{color:var(--note)}
.logrow[data-kind="watch"] .logmark{color:var(--ink-700)}
.logrow[data-kind="alert"] .logmark{color:var(--flag);font-weight:700}
.logrow[data-kind="dossier"] .logmark{color:var(--ink-700)}
.logtxt{color:var(--ink-700);flex:1;line-height:1.4}
.logtxt b{font-weight:600;color:var(--ink-900);font-family:var(--mono);font-size:11px}
.logts{font-family:var(--mono);font-size:11px;color:var(--ink-400);flex:none}

/* Thread — Gespräch, kein Formular */
.thread{display:flex;flex-direction:column;gap:var(--s4);margin-bottom:var(--s4)}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt.mine{flex-direction:row-reverse}
.cmt-av{width:29px;height:29px;border-radius:50%;background:var(--note-wash);color:var(--note-deep);font-size:10px;font-weight:700;display:grid;place-items:center;flex:none;letter-spacing:.02em;margin-top:2px}
.cmt-av.you{background:var(--ink-900);color:#fff}
.cmt-bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:9px 13px 10px;max-width:82%;box-shadow:0 1px 2px rgba(18,33,29,.03)}
.cmt.mine .cmt-bubble{background:var(--note-wash);border-color:var(--note-line);border-radius:12px 4px 12px 12px}
.cmt-meta{font-size:11px;color:var(--ink-400);margin-bottom:3px;display:flex;gap:8px;align-items:baseline}
.cmt-meta b{color:var(--ink-700);font-weight:600}
.cmt.mine .cmt-meta{justify-content:flex-end}
.cmt.mine .cmt-meta b{color:var(--note-deep)}
.cmt-body{font-size:13px;color:var(--ink-900);line-height:1.55}
.thread-empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--ink-400);padding:26px 20px}
.thread-empty svg{width:26px;height:26px;color:var(--ink-300)}
.thread-empty p{font-size:12.5px;max-width:32ch;line-height:1.5}

/* Composer — Fläche, die zum Feld wird */
.composer{display:flex;gap:10px;align-items:flex-end}
.composer-field{flex:1;display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;padding:6px 6px 6px 15px;transition:border-color .15s,box-shadow .15s}
.composer-field:focus-within{border-color:var(--note);box-shadow:0 0 0 3px var(--note-wash)}
.composer-field textarea{flex:1;border:none;background:none;outline:none;resize:none;font:inherit;font-size:13px;line-height:1.5;padding:6px 0;max-height:120px;color:var(--ink-900)}
.composer-send{width:32px;height:32px;border-radius:50%;background:var(--surface-3);color:var(--ink-400);display:grid;place-items:center;flex:none;transition:.15s;transform:scale(.9)}

.composer-field:focus-within .composer-send,.composer-send.ready{background:var(--note);color:#fff;transform:scale(1)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--ink-400);gap:10px;text-align:center;padding:20px}

const leadText = l => (l.titel+' '+l.buyer+' '+l.buyerShort+' '+l.natur+' '+(l.kw||[]).map(k=>k.w).join(' ')).toLowerCase();

function matchToken(l,t){
  if(t.type==='ort'){
    const reach = (t.radius && PLACE_RADIUS[t.value]?.[t.radius]) || [t.value];
    return reach.some(code => (l.nuts||'').startsWith(code));
  }
  if(t.type==='phase')    return l.src===t.value;
  if(t.type==='leistung') return l.naturKat===t.value;
  if(t.type==='cpv')      return String(l.cpv).startsWith(t.value);
  if(t.type==='buyer')    return l.buyerShort===t.value;
  return leadText(l).includes(t.value); // text
}

function hasToken(type,value){ return searchTokens.some(t=>t.type===type && t.value===value); }
function toggleToken(tok){
  const i = searchTokens.findIndex(t=>t.type===tok.type && t.value===tok.value);
  if(i>=0) searchTokens.splice(i,1); else searchTokens.push(tok);
  syncLocationColumn();
}

function classifyQuery(raw){
  const q = raw.trim().toLowerCase(); if(!q) return null;
  if(ORTE[q]) return {type:'ort',label:ORTE[q].label,value:ORTE[q].region};
  if(/^\d{2,5}$/.test(q) && PLZ[q.slice(0,2)]) return {type:'ort',label:'PLZ '+q+'…',value:PLZ[q.slice(0,2)]};
  return {type:'text',label:'„'+raw.trim()+'"',value:q};
}

function fristCell(l){
  if(l.tage != null){                       // offene Ausschreibung: Countdown
    const urg = l.tage <= 14;
    return `<span class="cd ${urg?'urg':''}">${val(l.tage+' Tage', l.timing.src, l.timing.hint)}<span class="cdsub">bis Schluss</span></span>`;
  }
  if(l.src==='f01') return `<span class="cd none">—<span class="cdsub">noch keine Frist</span></span>`;
  return `<span class="cd">${val(l.endet, l.timing.src, l.timing.hint)}<span class="cdsub">Vertragsende</span></span>`;
}

function visible(){
  const groups = {};
  for(const t of searchTokens){ (groups[t.type] ||= []).push(t); }
  return LEADS.filter(l => {
    if(l.branche !== aktiveBranche) return false;   // Grundraum: Branche aus Profil/Wechsel
    // Bestand = Verträge, in denen wir drin sind. Akquise = alles andere.
    if(editBestand){ /* alles der Branche sichtbar — Suche findet auch alte Vergaben */ }
    else if(filters.kandidaten) return !!l.eigenKandidat && l.eigenBestaetigt!==false;
    else {
    const bestand = document.body.dataset.view==='verteidigung';
    if(!filters.gemerkt){
      if(bestand && !(l.eigen && l.eigenBestaetigt!==false)) return false;
      if(!bestand && l.eigen && l.eigenBestaetigt!==false) return false;
    }
    }
    if(filters.ungesichtet && l.status!=='ungesichtet') return false;
    if(filters.gemerkt && !l.merk) return false;
    for(const [type, toks] of Object.entries(groups)){
      const ok = type==='text'
        ? toks.every(t=>matchToken(l,t))   // Stichworte: UND
        : toks.some(t=>matchToken(l,t));    // Facetten: ODER
      if(!ok) return false;                 // zwischen Facetten: UND
    }
    return true;
  });
}

// Ort-Filter aktiv → Region-Spalte automatisch einblenden
function syncLocationColumn(){
  const hasOrt = searchTokens.some(t=>t.type==='ort');
  const rc = COLS.find(c=>c.key==='region');
  if(rc) rc.on = hasOrt ? true : (rc._userOff ? false : rc.on);
}

function sorted(rows){
  const g = l => {
    switch(sortKey){
      case 'frist': return l.tage != null ? l.tage : (l.endTage!=null ? l.endTage : 9999);
      case 'vol': return l.volumen.src==='unbekannt' ? -1 : parseFloat(String(l.volumen.wert).replace(/[^\d,]/g,'').replace(',','.'))||0;
      case 'relevanz': return LVL[l.relevanz];
      case 'wechsel': return LVL[l.wechsel];
      case 'konk': { const m={gering:1,mittel:2,hoch:3}; return m[l.konk.stufe]||9; }
      case 'buyer': return l.buyerShort;
      case 'src': return l.src;
      default: return l.titel;
    }
  };
  return [...rows].sort((a,b)=>{
    const x=g(a), y=g(b);
    return (x<y?-1:x>y?1:0)*sortDir;
  });
}

function renderHead(){
  // Spalten, die einen Facetten-Filter im Kopf tragen → Menüname
  const HEADFILTER = { src:'phase', natur:'leistung', region:'region' };
  $('#thead').innerHTML = '<tr>' + COLS.filter(c=>c.on).map(c => {
    const cls = [c.th==='right'?'right':'', c.th==='center'?'center':''].filter(Boolean).join(' ');
    const sortable = ['titel','buyer','frist','relevanz','wechsel','vol','src','konk'].includes(c.key);
    const lbl = c.key==='wechsel' ? chanceCap() : c.label;
    const ar = sortKey===c.key ? (sortDir>0?'▲':'▼') : '';
    const draggable = c.key!=='star';
    const facet = HEADFILTER[c.key];
    const type = facet==='region'?'ort':facet;
    const nActive = facet ? searchTokens.filter(t=>t.type===type).length : 0;
    const funnel = facet
      ? `<button class="thfilter ${nActive?'on':''}" draggable="false" data-headfilter="${facet}" title="Filtern" aria-label="Spalte filtern">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5Z"/></svg>${nActive?`<span class="thfn">${nActive}</span>`:''}
        </button><div class="headpop" data-headpop="${facet}"></div>` : '';
    return `<th class="${cls} ${facet?'has-filter':''}" data-thcol="${c.key}" ${draggable?'draggable="true"':''} ${sortable?`data-sort="${c.key}"`:''} ${sortKey===c.key?'data-sorted':''}>
      <span class="th-lbl">${lbl}</span><span class="ar">${ar||'↕'}</span>${funnel}</th>`;
  }).join('') + '</tr>';
  renderHeadPops();
}

let openHeadFilter = null;
function renderHeadPops(){
  document.querySelectorAll('[data-headpop]').forEach(pop=>{
    const name = pop.dataset.headpop;
    if(name==='region'){
      const list = Object.values(ORTE).filter((v,i,a)=>a.findIndex(x=>x.region===v.region)===i);
      pop.innerHTML = `<div class="reglist">${list.map(o=>

    } else {
      const f = FACETS[name];
      pop.innerHTML = f.opts.map(o=>
        `<button class="facetopt ${hasToken(name,o.v)?'on':''}" data-facetopt="${name}:${o.v}"><span class="fbox"></span>${o.l}</button>`).join('');
    }
    pop.classList.toggle('open', openHeadFilter===name);
  });
}

/* Spalten per Drag & Drop umordnen */
let dragCol = null;
document.addEventListener('dragstart', e => {
  const th = e.target.closest('th[draggable]'); if(!th) return;
  dragCol = th.dataset.thcol; th.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
});
document.addEventListener('dragend', e => {
  e.target.closest('th')?.classList.remove('dragging');
  document.querySelectorAll('th.drop-l,th.drop-r').forEach(t=>t.classList.remove('drop-l','drop-r'));
  dragCol=null;
});
document.addEventListener('dragover', e => {
  const th = e.target.closest('th[data-thcol]'); if(!th || !dragCol || th.dataset.thcol==='star') return;
  e.preventDefault();
  const r = th.getBoundingClientRect();
  const after = e.clientX > r.left + r.width/2;
  document.querySelectorAll('th.drop-l,th.drop-r').forEach(t=>t.classList.remove('drop-l','drop-r'));
  th.classList.add(after?'drop-r':'drop-l');
});
document.addEventListener('drop', e => {
  const th = e.target.closest('th[data-thcol]'); if(!th || !dragCol || th.dataset.thcol==='star') return;
  e.preventDefault();
  const targetKey = th.dataset.thcol;
  if(targetKey===dragCol) return;
  const r = th.getBoundingClientRect();
  const after = e.clientX > r.left + r.width/2;
  const from = COLS.findIndex(c=>c.key===dragCol);
  const moved = COLS.splice(from,1)[0];
  let to = COLS.findIndex(c=>c.key===targetKey);
  if(after) to++;
  COLS.splice(to,0,moved);
  renderTable();
});

function cellHTML(l, key){
  switch(key){
    case 'own': {
      const drin = l.eigen && l.eigenBestaetigt!==false;
      return `<td class="c-own"><button class="owntog ${drin?'on':''}" data-own="${l.id}:${drin?'nein':'ja'}"
        title="${drin?'Aus dem Bestand entfernen':'Zum Bestand hinzufügen'}">${drin?'−':'+'}</button></td>`;
    }
    case 'star': return `<td class="c-star"><button class="tstar" data-star="${l.id}" ${l.merk?`data-merk="${l.merk}"`:''} aria-label="Merken">${STAR}</button></td>`;
    case 'src': return `<td class="c-src"><span class="srcpill src-${l.src}">${l.srcLabel}</span></td>`;
    case 'titel': return `<td class="c-titel"><span class="ttitel" title="${l.titel}">${l.titel}</span></td>`;
    case 'buyer': return `<td class="c-buyer" title="${l.buyer}">${l.buyerShort}</td>`;
    case 'frist': return `<td class="c-frist">${fristCell(l)}</td>`;
    case 'natur': return `<td class="c-natur"><span class="nat nat-${l.naturKat}">${l.natur}</span></td>`;
    case 'konk': return `<td class="c-konk">${konkCell(l)}</td>`;
    case 'neu': return `<td class="c-neu" style="text-align:center">${l.neu
        ? '<span class="wettb neu" title="Neuvergabe — kein Amtsinhaber, offenes Feld">Neu</span>'
        : '<span class="wettb folge" title="Folgevergabe — Amtsinhaber vorhanden">Folge</span>'}</td>`;
    case 'relevanz': return `<td class="c-band">${bandMeter(l.relevanz)}</td>`;
    case 'wechsel': return `<td class="c-band">${bandMeter(l.wechsel, true, chanceCap())}${
      l.src==='f02' && l.wechsel!=='na'
        ? '<span class="pdot pdot-schaetz" title="Geschätzt — bei offenen Ausschreibungen liegt noch keine Bieterzahl vor"></span>'
        : ''}</td>`;
    case 'vol': return `<td class="c-vol">${l.volumen.src==='unbekannt' ? '<span style="color:var(--ink-300)">Wert offen</span>' : val(l.volumen.wert, l.volumen.src, l.volumen.hint)}</td>`;
    case 'region': return `<td class="c-region">${l.region}</td>`;
    case 'inc': return `<td class="c-inc">${l.incumbent ? val(l.incumbent.name, l.incumbent.src) : '<span style="color:var(--ink-300)">offen</span>'}</td>`;
    case 'status': return `<td class="c-status"><span class="stat">${l.seen || (l.status==='ungesichtet'?'neu':'gesichtet')}</span></td>`;
    case 'wf': return `<td class="c-wf">${l.userStatus ? wfPill(l.userStatus) : '<span class="wf-none">—</span>'}</td>`;
  }
}

function suggestList(raw){
  const q = raw.trim().toLowerCase(); if(!q) return [];
  const out=[]; const seen=new Set();
  const push=(o)=>{const k=o.type+o.value; if(!seen.has(k)){seen.add(k); out.push(o);}};
  for(const [k,v] of Object.entries(ORTE)) if(k.startsWith(q)) push({type:'ort',value:v.region,label:v.label,cat:'Ort'});
  if(/^\d{2,5}$/.test(q) && PLZ[q.slice(0,2)]) push({type:'ort',value:PLZ[q.slice(0,2)],label:'PLZ '+q+'…',cat:'Ort'});
  [...new Set(LEADS.map(l=>l.buyerShort))].forEach(b=>{ if(b.toLowerCase().includes(q)) push({type:'buyer',value:b,label:b,cat:'Auftraggeber'}); });
  [...new Set(LEADS.flatMap(l=>(l.kw||[]).map(k=>k.w)))].forEach(w=>{ if(w.toLowerCase().includes(q)) push({type:'text',value:w.toLowerCase(),label:w,cat:'Stichwort'}); });
  [...new Set(LEADS.map(l=>l.natur))].forEach(n=>{ if(n.toLowerCase().includes(q)) push({type:'text',value:n.toLowerCase(),label:n,cat:'Leistung'}); });
  return out.slice(0,7);
}

function renderSuggest(){
  const box = $('#suggest'); const q = $('#q').value;
  const items = suggListCache = suggListCache; // set below
  const list = suggListCache;
  if(!q.trim() || !list.length){ box.classList.remove('open'); box.innerHTML=''; return; }

      <span class="sugg-lbl">${o.label}</span><span class="sugg-cat">${o.cat}</span></button>`).join('')
    + `<button class="sugg sugg-raw ${suggIdx===list.length?'hl':''}" data-sugg="raw"><span class="sugg-ic">${TOKICON.text}</span><span class="sugg-lbl">„${q.trim()}" als Freitext suchen</span></button>`;
  box.classList.add('open');
}
let suggListCache = [];
function updateSuggest(){ suggListCache = suggList($('#q').value); suggIdx=-1; renderSuggest(); }
function suggList(q){ return suggestList(q); }
function commitSearch(pick){
  const inp = $('#q');
  let tok = pick;
  if(!tok){
    if(suggIdx>=0 && suggIdx<suggListCache.length) tok = suggListCache[suggIdx];
    else tok = classifyQuery(inp.value);
  }
  if(tok){
    if(!hasToken(tok.type,tok.value)) searchTokens.push({type:tok.type,value:tok.value,label:tok.label});
    inp.value=''; suggListCache=[]; suggIdx=-1;
    $('#suggest').classList.remove('open'); $('#suggest').innerHTML='';
    syncLocationColumn(); renderTable();
  }
}

let anaSpyBound = false;
function setupAnaSpy(){
  const panel = $('#detail'); if(!panel) return;
  const nav = document.querySelector('.ananav');
  const spy = () => {
    // Sprungliste an der Scrollposition festhalten
    if(nav){
      const body = nav.closest('.dbody-ana');
      const pad = 8;
      const maxShift = body ? body.offsetHeight - nav.offsetHeight - pad : 0;
      const shift = Math.max(0, Math.min(panel.scrollTop + pad, Math.max(0,maxShift)));
      nav.style.transform = `translateY(${shift}px)`;
    }
    const secs = [...document.querySelectorAll('.anagrid > .sec[data-sec]')];
    if(!secs.length) return;
    const top = panel.getBoundingClientRect().top + 80;
    let cur = secs[0];
    for(const sec of secs){ if(sec.getBoundingClientRect().top <= top) cur = sec; }
    document.querySelectorAll('.anav-item').forEach(b=>
      b.classList.toggle('on', b.dataset.anav===cur.dataset.sec));
  };
  panel.onscroll = spy;
  spy();
}
